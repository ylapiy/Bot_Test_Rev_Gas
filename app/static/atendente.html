<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Atendente</title>
<style>
  :root{--bg:#f3f4f6;--borda:#dfe3e8;--texto:#1f2933;--suave:#6b7785;--acento:#128c7e;--urg:#b3261e;--alta:#c25e00}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--texto);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--borda)}
  header h1{font-size:16px;margin:0}
  .chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--borda);background:#f7f8fa}
  main{flex:1;display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px;min-height:0}
  section{background:#fff;border:1px solid var(--borda);border-radius:10px;display:flex;flex-direction:column;min-height:0}
  section h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);margin:0;padding:12px 14px;border-bottom:1px solid var(--borda);display:flex;gap:8px;align-items:center}
  #lista{overflow:auto}
  .item{padding:10px 14px;border-bottom:1px solid var(--borda);cursor:pointer}
  .item:hover{background:#f8fafb}.item.sel{background:#e8f5f3}
  .item .linha{display:flex;gap:6px;align-items:center}
  .item small{color:var(--suave)}
  .p{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff;background:#5f6b76}
  .p.urgente{background:var(--urg)}.p.alta{background:var(--alta)}
  .st{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--borda)}
  #det{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--borda);border-radius:8px;padding:10px 12px;background:#fbfcfd}
  .card h3{margin:0 0 6px;font-size:13px;color:var(--suave);text-transform:uppercase;letter-spacing:.03em}
  .conversa{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;background:#efeae2;padding:10px;border-radius:8px}
  .m{max-width:80%;padding:6px 9px;border-radius:8px;white-space:pre-wrap;font-size:13px}
  .m.cliente{align-self:flex-end;background:#dcf8c6}.m.bot{background:#fff}.m.atendente{background:#fff7d6}
  .m small{display:block;color:#8a96a0;font-size:11px}
  textarea{width:100%;font:inherit;border:1px solid var(--borda);border-radius:8px;padding:8px;min-height:70px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--borda);background:#fff;padding:7px 12px}
  button.prim{background:var(--acento);border-color:var(--acento);color:#fff}
  .acoes{display:flex;gap:8px;flex-wrap:wrap}
  dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:0;font-size:13px}dt{color:var(--suave)}dd{margin:0}
  .vazio{color:var(--suave)}
</style>
</head>
<body>
<header>
  <h1>👤 Painel do Atendente</h1>
  <span class="chip" id="horario"></span>
  <span style="margin-left:auto" class="chip">atualiza sozinho a cada 3 s</span>
  <input id="nomeAt" placeholder="Seu nome" style="font:inherit;padding:6px 8px;border:1px solid var(--borda);border-radius:8px">
</header>
<main>
  <section>
    <h2>Transferências <select id="filtro" onchange="carregar()" style="margin-left:auto;font:inherit">
      <option value="">abertas + em atendimento</option><option value="aberto">só abertas</option>
      <option value="em_atendimento">em atendimento</option><option value="encerrado">encerradas</option></select></h2>
    <div id="lista"><p class="vazio" style="padding:14px">Carregando…</p></div>
  </section>
  <section>
    <h2>Detalhes</h2>
    <div id="det"><p class="vazio">Selecione uma transferência à esquerda.</p></div>
  </section>
</main>
<script>
let senha = sessionStorage.getItem('senhaPainel') || '', sel = null, cache = [];
const nomeAt = document.getElementById('nomeAt');
nomeAt.value = localStorage.getItem('nomeAtendente') || '';
nomeAt.onchange = () => localStorage.setItem('nomeAtendente', nomeAt.value);
function h(s){return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(url, corpo){
  if (!senha){ senha = prompt('Senha do painel (PAINEL_ATENDENTE_SENHA no .env):') || ''; sessionStorage.setItem('senhaPainel', senha); }
  const op = {headers:{'Content-Type':'application/json','X-Painel-Senha':senha}};
  if (corpo !== undefined){op.method='POST';op.body=JSON.stringify(corpo)}
  const r = await fetch(url, op);
  if (r.status===401){ senha=''; sessionStorage.removeItem('senhaPainel'); alert('Senha inválida'); throw new Error('401'); }
  const j = await r.json(); if (!r.ok) throw new Error(j.erro||r.statusText); return j;
}
async function carregar(){
  const f = document.getElementById('filtro').value;
  const j = await api('/api/atendente/handoffs' + (f ? '?status='+f : ''));
  document.getElementById('horario').textContent = j.dentro_do_horario ? '🟢 dentro do horário de atendimento' : '🌙 fora do horário (bot segue atendendo)';
  cache = f ? j.handoffs : j.handoffs.filter(x => x.status !== 'encerrado');
  document.getElementById('lista').innerHTML = cache.length ? cache.map(x => `
    <div class="item ${sel===x.id?'sel':''}" onclick="abrir(${x.id})">
      <div class="linha"><span class="p ${x.prioridade}">${h(x.prioridade)}</span><b>${h(x.nome || x.dados?.cliente?.nome || 'Cliente')}</b>
      <span class="st" style="margin-left:auto">${h(x.status.replace('_',' '))}</span></div>
      <div>${h(x.motivo)}</div><small>${h(x.canal)} · ${h(x.telefone_mascarado)} · ${h(x.criado_em)}</small></div>`).join('')
    : '<p class="vazio" style="padding:14px">Nenhuma transferência.</p>';
  if (sel) abrir(sel, true);
}
async function abrir(id, silencioso){
  sel = id; const x = cache.find(c => c.id===id); if (!x) return;
  if (!silencioso) document.querySelectorAll('.item').forEach(e=>e.classList.remove('sel'));
  const c = await api('/api/atendente/conversa/' + x.conversa_id);
  const d = c.dados || {}; const cli = d.cliente || {};
  const rolagem = document.querySelector('.conversa')?.scrollTop;
  document.getElementById('det').innerHTML = `
    <div class="card"><h3>Resumo para o atendente</h3>${h(x.resumo)}</div>
    <div class="card"><h3>Dados coletados pelo bot</h3><dl>
      <dt>Cliente</dt><dd>${h(cli.nome || 'não identificado')} ${cli.verificado ? '✅ verificado' : ''}</dd>
      <dt>Documento</dt><dd>${h(cli.documento || '-')}</dd><dt>Telefone</dt><dd>${h(cli.telefone || '-')}</dd>
      <dt>Pedido em contexto</dt><dd>${h(d.pedido_atual || '-')}</dd><dt>Produto</dt><dd>${h(d.produto_em_contexto || '-')}</dd>
      <dt>Assuntos</dt><dd>${h((d.intencoes_da_conversa||[]).join(', ') || '-')}</dd><dt>Canal</dt><dd>${h(c.canal)}</dd>
      <dt>Estado</dt><dd>${c.estado === 'humano' ? '👤 com atendente (bot em silêncio)' : '🤖 bot atendendo'}</dd></dl></div>
    <div class="card"><h3>Conversa</h3><div class="conversa">${c.mensagens.map(m =>
      `<div class="m ${m.papel}"><small>${h(m.papel)} · ${h(m.criado_em.slice(11,16))}</small>${h(m.texto)}</div>`).join('')}</div></div>
    <div class="card"><h3>Responder ao cliente</h3><textarea id="resp" placeholder="Escreva a resposta..."></textarea>
      <div class="acoes" style="margin-top:8px">
        <button class="prim" onclick="responder(${x.id})">Enviar</button>
        <button onclick="assumir(${x.id})">Assumir (bot fica em silêncio)</button>
        <button onclick="encerrar(${x.id})">Encerrar e devolver ao bot</button></div></div>`;
  const conv = document.querySelector('.conversa'); if (conv) conv.scrollTop = rolagem ?? conv.scrollHeight;
}
const quem = () => nomeAt.value.trim() || 'Atendente';
async function responder(id){ const t = document.getElementById('resp').value.trim(); if(!t) return;
  try{ await api(`/api/atendente/handoffs/${id}/responder`, {atendente: quem(), texto: t}); document.getElementById('resp').value=''; carregar(); }
  catch(e){ alert(e.message) } }
async function assumir(id){ await api(`/api/atendente/handoffs/${id}/assumir`, {atendente: quem()}); carregar(); }
async function encerrar(id){ if(!confirm('Encerrar e devolver a conversa para o bot?')) return;
  await api(`/api/atendente/handoffs/${id}/encerrar`, {atendente: quem()}); sel=null; carregar(); }
carregar(); setInterval(() => { if (!document.activeElement || document.activeElement.id !== 'resp') carregar(); }, 3000);
</script>
</body>
</html>
